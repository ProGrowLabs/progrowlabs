<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes barIn {
      0%   { transform: scaleY(0); opacity: 0; }
      65%  { transform: scaleY(1.06); opacity: 1; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes eq1 {
      0%,100% { transform: translateY(0); }
      25%     { transform: translateY(-11px); }
      50%     { transform: translateY(-3px); }
      75%     { transform: translateY(-15px); }
    }
    @keyframes eq2 {
      0%,100% { transform: translateY(0); }
      20%     { transform: translateY(-20px); }
      55%     { transform: translateY(-7px); }
      80%     { transform: translateY(-13px); }
    }
    @keyframes eq3 {
      0%,100% { transform: translateY(0); }
      35%     { transform: translateY(-24px); }
      65%     { transform: translateY(-9px); }
    }
    .bar1 { transform-origin: 8px 56px;  animation: barIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.05s both; }
    .bar2 { transform-origin: 30px 56px; animation: barIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.16s both; }
    .bar3 { transform-origin: 52px 56px; animation: barIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.27s both; }
    .ball1 { animation: eq1 1.7s ease-in-out 0.6s infinite; }
    .ball2 { animation: eq2 1.7s ease-in-out 0.75s infinite; }
    .ball3 { animation: eq3 1.7s ease-in-out 0.9s infinite; }
  </style>

  <!-- Bars -->
  <rect class="bar1" x="0"  y="42" width="16" height="22" rx="3.5" fill="#9FE1CB"/>
  <rect class="bar2" x="22" y="28" width="16" height="36" rx="3.5" fill="#5DCAA5"/>
  <rect class="bar3" x="44" y="14" width="16" height="50" rx="3.5" fill="#1D9E75"/>

  <!-- Balls -->
  <circle class="ball1" cx="8"  cy="38" r="7.5" fill="#0F6E56"/>
  <circle class="ball2" cx="30" cy="24" r="7.5" fill="#0F6E56"/>
  <circle class="ball3" cx="52" cy="10" r="7.5" fill="#0F6E56"/>
</svg>